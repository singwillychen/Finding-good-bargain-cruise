[project]
name = "cruise-tracker"
version = "0.1.0"
description = "Track cruise prices on Vacations To Go and CruiseDirect, find bargains, send a weekly Telegram digest."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "apscheduler>=3.10,<4",
  "pydantic-settings>=2.2",
  "playwright>=1.44",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cruise = "cruise_tracker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cruise_tracker = ["web/templates/*.html", "web/static/*", "demo_data.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
